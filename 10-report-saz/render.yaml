services:
  - type: web
    name: report-saz
    runtime: python
    plan: free
    region: frankfurt
    rootDir: 10-report-saz
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn reportsaz.webapp:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: SECRET_KEY
        generateValue: true
