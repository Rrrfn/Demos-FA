# Render Blueprint — هلدینگ آرمان (Static Site)
#
# rootDir الزامی است: این پروژه داخل یک مخزن چندپروژه‌ای قرار دارد و باید از
# همین پوشه منتشر شود؛ در غیر این صورت Render از ریشهٔ مخزن منتشر می‌کند و
# هیچ فایل سایتی پیدا نمی‌شود.
services:
  - type: web
    name: arman-holding
    runtime: static
    rootDir: 02-arman-holding
    buildCommand: ""          # سایت ایستا؛ مرحلهٔ بیلد ندارد
    staticPublishPath: .      # نسبت به rootDir
    headers:
      # تصاویر و فونت‌ها با تغییر نام عوض می‌شوند، پس کش بلندمدت بی‌خطر است.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # CSS و JS بدون هش محتوا هستند؛ کش کوتاه‌تر تا انتشار بعدی سریع دیده شود.
      - path: /css/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /js/*
        name: Cache-Control
        value: public, max-age=604800
      # سند اصلی همیشه تازه بررسی شود.
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
